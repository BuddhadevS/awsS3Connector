spring.application.name=aws
aws.accessKey=${AWS_ACCESS_KEY:}
aws.secretKey=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:eu-north-1}
aws.bucketName=${AWS_BUCKET_NAME:}
presign.expiry=${AWS_PRESIGN_EXPIRY_MINUTES:15}
app.media.max-file-size-bytes=${APP_MEDIA_MAX_FILE_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aws_media?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=${SERVER_PORT:8081}
